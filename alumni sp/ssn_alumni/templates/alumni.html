<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSN Alumni Registry — Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/portal.css">
<style>
    /* Section Visibility Toggle */
    .tab-content { display: none; margin-top: 24px; }
    .tab-content.active { display: block; }

    /* Modern Icon Nav Styling */
    nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #ffffff; border-bottom: 1px solid #e2e8f0; }
    nav ul { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .nav-btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: #64748b; font-weight: 500; font-size: 14px; transition: all 0.2s ease; }
    .nav-btn:hover { background: #f1f5f9; color: #0f172a; }
    .nav-btn.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
    .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Notification Drawer */
    .notif-wrapper { position: relative; }
    .notif-btn { background: none; border: none; cursor: pointer; position: relative; padding: 8px; border-radius: 50%; }
    .notif-badge { position: absolute; top: 2px; right: 2px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 5px; font-size: 10px; font-weight: bold; }
    .dropdown-panel { display: none; position: absolute; right: 0; top: 40px; width: 320px; background: white; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 8px; z-index: 1000; padding: 16px; }
    .dropdown-panel.active { display: block; }

    /* Workspace Layout */
    .chat-container { display: flex; gap: 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; height: 450px; }
    .chat-sidebar { width: 30%; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 12px; }
    .chat-window { width: 70%; display: flex; flex-direction: column; padding: 12px; }
    .chat-messages { flex-grow: 1; overflow-y: auto; border: 1px solid #f1f5f9; background: #f8fafc; padding: 12px; margin-bottom: 12px; border-radius: 6px; }
    .msg-item { margin-bottom: 8px; padding: 8px 12px; border-radius: 6px; font-size: 13px; max-width: 70%; }
    .msg-sent { background: #2563eb; color: white; margin-left: auto; text-align: right; }
    .msg-received { background: #e2e8f0; color: #0f172a; margin-right: auto; }
    .user-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; border-radius: 6px; transition: background 0.15s; }
    .user-item:hover, .user-item.active { background: #eff6ff; }
</style>
</head>
<body class="theme-alumni">

<nav>
    <h2>SSN Registry <span class="role-tag">Alumni</span></h2>
    <ul>
        <li>
            <button class="nav-btn active" onclick="switchTab('profile', this)">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Profile
            </button>
        </li>
        <li>
            <button class="nav-btn" onclick="switchTab('jobs', this)">
                <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                Jobs
            </button>
        </li>
        <li>
            <button class="nav-btn" onclick="switchTab('chat', this)">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Mentorship
            </button>
        </li>
        <li>
            <button class="nav-btn" onclick="switchTab('events', this)">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Events
            </button>
        </li>
    </ul>

    <div style="display: flex; align-items: center; gap: 16px;">
        <div class="notif-wrapper">
            <button class="notif-btn" id="notifBtn" onclick="toggleNotifs()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="notif-badge" id="notifCount">0</span>
            </button>
            <div class="dropdown-panel" id="notifDropdown">
                <h4>Mentorship Requests</h4>
                <div id="requestList"></div>
                <hr style="margin: 12px 0;">
                <h4>Notifications</h4>
                <div id="notifList"></div>
            </div>
        </div>
        <button onclick="logout()" class="nav-btn" style="color: #ef4444;">Logout</button>
    </div>
</nav>

<div class="container" style="padding: 24px;">
    <!-- Profile Tab -->
    <section id="profile" class="tab-content active">
        <h2 class="section-title">Edit Profile</h2>
        <form id="profileForm" class="ledger-panel">
            <input type="text" id="profileName" placeholder="Full Name" required>
            <input type="email" id="profileEmail" placeholder="Email" disabled>
            <input type="text" id="profileCompany" placeholder="Current Company">
            <input type="text" id="profileDesignation" placeholder="Designation">
            <textarea id="profileAbout" placeholder="About yourself"></textarea>
            <button type="submit">Save Updates</button>
            <p class="save-note" id="saveNote"></p>
        </form>
    </section>

    <!-- Jobs Tab -->
    <section id="jobs" class="tab-content">
        <h2 class="section-title">Post Opportunity</h2>
        <form id="jobForm" class="ledger-panel">
            <input type="text" id="jobTitle" placeholder="Job Title" required>
            <input type="text" id="jobCompany" placeholder="Company" required>
            <input type="text" id="jobLocation" placeholder="Location" required>
            <input type="url" id="jobLink" placeholder="Apply Link (optional)">
            <textarea id="jobDescription" placeholder="Job Description" required></textarea>
            <button type="submit">Post Opportunity</button>
        </form>

        <h2 class="section-title" style="margin-top: 36px;">My Job Listings</h2>
        <div class="job-list" id="myJobList"></div>
    </section>

    <!-- Mentorship/Chat Tab -->
    <section id="chat" class="tab-content">
        <h2 class="section-title">Mentee Workspace</h2>
        <div class="chat-container">
            <div class="chat-sidebar" id="menteeList"></div>
            <div class="chat-window">
                <div class="chat-messages" id="chatBox">Select a student from the sidebar to open the chat window.</div>
                <div style="display:flex; gap: 8px;">
                    <input type="text" id="chatInput" placeholder="Type a message..." style="flex-grow:1;">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Events Tab -->
    <section id="events" class="tab-content">
        <h2 class="section-title">Upcoming Campus Events</h2>
        <div class="event-container" id="eventList"></div>
    </section>
</div>

<footer>SSN College of Engineering · Alumni Registry</footer>

<script src="/static/alumni.js"></script>
</body>
</html>
