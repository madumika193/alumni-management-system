<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSN Alumni Registry — Faculty</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/portal.css">
</head>
<body class="theme-faculty">

<nav>
    <h2>SSN Registry <span class="role-tag">Faculty</span></h2>
    <button onclick="logout()">Logout</button>
</nav>

<section class="hero">
    <h1>Welcome, Professor <span id="userName">Faculty</span></h1>
    <p>Department: <strong id="facultyDept">...</strong></p>
</section>

<!-- Locked to own department only — students and alumni, nothing else -->
<section id="deptRoster">
    <h2 class="section-title"><span id="deptRosterTitle"></span> Department Roster</h2>

    <p style="color: var(--muted); font-size: 13.5px; margin-bottom: 16px;">Students</p>
    <div class="directory" id="deptStudentList" style="margin-bottom: 34px;"></div>

    <p style="color: var(--muted); font-size: 13.5px; margin-bottom: 16px;">Alumni</p>
    <div class="directory" id="deptAlumniList"></div>
</section>

<footer>SSN College of Engineering · Alumni Registry</footer>

<script src="/static/faculty.js"></script>
</body>
</html>
